# Prestige: every effect the viewer ships must compile.
#
# Builds slfxc (vkgfx/third_party/reshadefx/tools: the viewer's own ReShade FX front end,
# vkgfx/llfxcompile.cpp, with no viewer dependencies) natively and compiles every .fx in
# app_settings/fx/pack the way the viewer does: the same include folders (every folder of the
# pack, then app_settings/fx/Shaders), the same predefined macros and codegen, then
# spirv-val --target-env vulkan1.3 on every entry point. A failure lists the effect and the
# compiler's message, so a broken filter never reaches an installer.
name: Prestige effects check

on:
  workflow_dispatch:
  push:
    branches: [firestorm-feel, build-full]
    paths:
      - "indra/newview/app_settings/fx/**"
      - "indra/newview/vkgfx/llfxcompile.*"
      - "indra/newview/vkgfx/third_party/reshadefx/**"
      - ".github/workflows/prestige-fx-check.yml"

jobs:
  fx-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install spirv-val
        run: sudo apt-get update -q && sudo apt-get install -y -q spirv-tools

      - name: Build slfxc (the viewer's effect compiler, standalone)
        run: |
          set -euo pipefail
          R=indra/newview/vkgfx/third_party/reshadefx
          mkdir -p "$RUNNER_TEMP/obj"
          for f in "$R"/src/*.cpp; do
            g++ -std=c++17 -O1 -w -I"$R/src" -I"$R/include/spirv" -c "$f" -o "$RUNNER_TEMP/obj/$(basename "$f").o" &
          done
          wait
          g++ -std=c++20 -O1 -w -I"$R/src" -I"$R/include/spirv" -Iindra/newview/vkgfx \
              -c indra/newview/vkgfx/llfxcompile.cpp -o "$RUNNER_TEMP/obj/llfxcompile.o"
          g++ -std=c++20 -O1 -w -I"$R/src" -I"$R/include/spirv" -Iindra/newview/vkgfx \
              -c "$R/tools/slfxc.cpp" -o "$RUNNER_TEMP/obj/slfxc.o"
          g++ "$RUNNER_TEMP"/obj/*.o -o "$RUNNER_TEMP/slfxc" -lpthread
          ls -la "$RUNNER_TEMP/slfxc"

      - name: Compile every bundled effect
        run: |
          set -uo pipefail
          # Windows (the viewer's only platform) opens include files whatever their case and takes
          # "\" as a separator ("Reshade.fxh", ".\CobraUtility.fxh"). Check a copy of the pack on
          # this case-sensitive runner with those includes resolved as Windows does.
          cp -r indra/newview/app_settings/fx/pack/Shaders "$RUNNER_TEMP/pack"
          cp -r indra/newview/app_settings/fx/Shaders "$RUNNER_TEMP/base"
          python3 - "$RUNNER_TEMP/pack" "$RUNNER_TEMP/base" <<'PY'
          import os, re, sys
          roots = sys.argv[1:]
          files = [os.path.join(d, f) for r in roots for d, _, fs in os.walk(r) for f in fs]
          inc = re.compile(r'(#\s*include\s*")([^"]+)(")')
          for p in files:
              if not p.lower().endswith((".fx", ".fxh")):
                  continue
              src = open(p, encoding="utf-8", errors="surrogateescape").read()
              out = inc.sub(lambda m: m.group(1) + m.group(2).replace("\\", "/") + m.group(3), src)
              if out != src:
                  open(p, "w", encoding="utf-8", errors="surrogateescape").write(out)
              for name in inc.findall(out):
                  rel = os.path.normpath(name[1])
                  here = os.path.dirname(p)
                  cands = [here] + sorted({os.path.dirname(f) for f in files})
                  if any(os.path.exists(os.path.join(c, rel)) for c in cands):
                      continue
                  for c in cands:
                      d = os.path.join(c, os.path.dirname(rel))
                      if not os.path.isdir(d):
                          continue
                      hit = [f for f in os.listdir(d) if f.lower() == os.path.basename(rel).lower()]
                      if hit:
                          os.symlink(hit[0], os.path.join(d, os.path.basename(rel)))
                          print("case:", os.path.join(d, os.path.basename(rel)), "->", hit[0])
                          break
          PY
          PACK="$RUNNER_TEMP/pack"
          INC=()
          while IFS= read -r d; do INC+=(-I "$d"); done < <(find "$PACK" -type d | sort)
          INC+=(-I "$RUNNER_TEMP/base")
          mapfile -t FX < <(find "$PACK" -name '*.fx' | sort)
          echo "${#FX[@]} effects"
          fails=0
          for fx in "${FX[@]}"; do
            if out=$("$RUNNER_TEMP/slfxc" "${INC[@]}" --quiet --out "$RUNNER_TEMP/spv" "$fx" 2>&1); then
              echo "ok      $fx"
            elif ! grep -q "compile:" <<<"$out" && grep -q "spirv-val" <<<"$out" \
                 && [ -z "$(grep -o 'VUID-[A-Za-z0-9-]*' <<<"$out" | grep -v 'Offset-10213')" ]; then
              # ReShade's own codegen: a non-constant tex*offset uses the Offset operand (upstream
              # ReShade has always done so; desktop drivers accept it). Only the newest
              # spirv-val rule flags it, so it is reported, not failed.
              echo "ok*     $fx (spirv-val: non-constant texture offset, as upstream ReShade)"
              echo "::warning file=$fx::non-constant tex*offset (VUID-RuntimeSpirv-Offset-10213), as upstream ReShade"
            else
              echo "FAILED  $fx"
              echo "$out" | sed 's/^/        /' | head -40
              echo "::error file=$fx::effect does not compile in the viewer"
              fails=$((fails + 1))
            fi
          done
          echo "$fails of ${#FX[@]} effects failed"
          [ "$fails" -eq 0 ]
