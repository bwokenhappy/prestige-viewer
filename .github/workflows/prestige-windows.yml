# Prestige Viewer: Windows x64 test build on GitHub-hosted runners.
#
# Cross-compiles on Ubuntu (scripts/wincross: clang-cl + lld-link 22 against the MSVC
# CRT / Windows SDK unpacked by xwin), then uploads
# Prestige_<version>_win64.zip and Prestige_<version>_Setup.exe as a run artifact.
#
# Helpers: four "helper" jobs compile a quarter of the source files each, at the same time, into
# the compile cache (ccache) and hand on what they compiled; the "windows" job merges that into
# its cache, builds everything (nearly all of it already compiled), links and packages.
#
# Run it from the Actions tab ("Run workflow"), or push to the prestige branch.
name: Prestige Windows build

on:
  workflow_dispatch:
  push:
    branches: [prestige]

concurrency:
  group: prestige-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "22"
  SL_3P_CACHE: ${{ github.workspace }}/.3p-cache
  XWIN_ROOT: /home/runner/.xwin
  # 4 vCPU / 16 GB runner (+16 GB swap): big translation units need several GB each, and with
  # ccache the files that include the generated vk_world_shaders_spv.h (most of vkgfx/) need
  # about twice that (ccache preprocesses first). Three at once starved the machines.
  NINJA_JOBS: "2"
  # Compile cache: a build only recompiles what changed since the last cached build.
  # CMake picks the launcher up from these variables; 00-Common.cmake then switches
  # debug info from /Zi to the cacheable /Z7.
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 4G
  CCACHE_COMPRESS: "true"
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines,locale

jobs:
  helper:
    name: helper ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/wincross-setup

      - name: Restore compile cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-win-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-win-${{ github.ref_name }}-
            ccache-win-

      - name: Compile a quarter of the viewer into the compile cache
        env:
          WINCROSS_SHARD: ${{ matrix.shard }}/4
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          ccache -z
          touch "$RUNNER_TEMP/helper-start"
          bash scripts/ci/version.sh
          make windows RUN_CHECKS=0 SL_3P_CACHE="$SL_3P_CACHE"
          ccache -s
          # only what this helper compiled: the restored cache is older than the stamp
          ( cd "$CCACHE_DIR" && find . -type f -newer "$RUNNER_TEMP/helper-start" -print0 \
              | tar --null -T - -cf "$RUNNER_TEMP/ccache-helper.tar" )
          ls -la "$RUNNER_TEMP/ccache-helper.tar"

      - name: Hand on what this helper compiled
        uses: actions/upload-artifact@v4
        with:
          name: ccache-helper-${{ matrix.shard }}
          path: ${{ runner.temp }}/ccache-helper.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn

  windows:
    needs: helper
    # a helper that broke only makes this job slower: it compiles what is missing itself
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      # the merged cache (the last build's plus the helpers'): room for all of it
      CCACHE_MAXSIZE: 8G
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/wincross-setup

      - name: Restore compile cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-win-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-win-${{ github.ref_name }}-
            ccache-win-

      - name: Fetch what the helpers compiled
        continue-on-error: true   # none (every helper broke): the build compiles it all itself
        uses: actions/download-artifact@v4
        with:
          pattern: ccache-helper-*
          path: ${{ runner.temp }}/helpers

      - name: Merge it into the compile cache
        run: |
          set -euo pipefail
          mkdir -p "$CCACHE_DIR"
          shopt -s nullglob
          for t in "$RUNNER_TEMP"/helpers/*/ccache-helper.tar; do
            echo "merging $t"
            tar -C "$CCACHE_DIR" -xf "$t"
          done
          du -sh "$CCACHE_DIR"

      - name: Cross-build and package Prestige (Windows x64)
        run: |
          set -euo pipefail
          ccache -z
          bash scripts/ci/version.sh
          make windows RUN_CHECKS=0 SL_3P_CACHE="$SL_3P_CACHE"
          ls -la build-windows-x86_64/package/
          ccache -s
          df -h /

      - name: Save compile cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-win-${{ github.ref_name }}-${{ github.sha }}

      - name: Upload Prestige for Windows
        uses: actions/upload-artifact@v4
        with:
          name: Prestige-Windows-x64
          path: |
            build-windows-x86_64/package/*_win64.zip
            build-windows-x86_64/package/*_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-windows-x86_64/CMakeFiles/CMakeOutput.log
            build-windows-x86_64/CMakeFiles/CMakeError.log
            build-windows-x86_64/CMakeFiles/CMakeConfigureLog.yaml
            build-windows-x86_64/.ninja_log
          if-no-files-found: ignore
