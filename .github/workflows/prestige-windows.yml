# Prestige Viewer: Windows x64 test build on GitHub-hosted runners.
#
# Cross-compiles on Ubuntu (scripts/wincross: clang-cl + lld-link 22 against the MSVC
# CRT / Windows SDK unpacked by xwin), then uploads
# Prestige_<version>_win64.zip and Prestige_<version>_Setup.exe as a run artifact.
#
# Run it from the Actions tab ("Run workflow"), or push to the prestige branch.
name: Prestige Windows build

on:
  workflow_dispatch:
  push:
    branches: [prestige]

concurrency:
  group: prestige-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      LLVM_VERSION: "22"
      SL_3P_CACHE: ${{ github.workspace }}/.3p-cache
      XWIN_ROOT: /home/runner/.xwin
      # 4 vCPU / 16 GB runner: big translation units need several GB each.
      NINJA_JOBS: "3"
    steps:
      - name: Free disk space (the build needs ~30 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
                      /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4

      - name: Install build tools (CMake/Ninja, shader compilers, Vulkan, NSIS, 7z, LLVM ${{ env.LLVM_VERSION }})
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build glslc glslang-tools libvulkan-dev libvulkan1 \
               7zip nsis python3-venv binutils wget lsb-release software-properties-common gnupg
          # modern 7-Zip (opens the vc_redist installer bundle) under the name the scripts call
          if command -v 7zz >/dev/null; then sudo ln -sf "$(command -v 7zz)" /usr/local/bin/7z; fi
          wget -q https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y -q "llvm-$LLVM_VERSION" "lld-$LLVM_VERSION" "clang-$LLVM_VERSION"
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"

      - name: Check tools
        run: |
          set -euo pipefail
          for t in clang-cl lld-link llvm-lib llvm-rc llvm-mt llvm-dlltool glslc glslangValidator ninja cmake 7z makensis; do
            printf '%-16s %s\n' "$t" "$(command -v $t || echo MISSING)"
            command -v "$t" >/dev/null
          done
          clang-cl --version | head -1
          cmake --version | head -1

      - name: Restore Windows SDK (xwin) cache
        id: xwin-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.XWIN_ROOT }}
          key: xwin-sdk-v1

      - name: Install xwin and unpack the MSVC CRT / Windows SDK
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/xwin
          if gh release download --repo Jake-Shadle/xwin --pattern '*x86_64-unknown-linux-musl.tar.gz' -D /tmp/xwin; then
            tar -xzf /tmp/xwin/*.tar.gz -C /tmp/xwin
            XWIN=$(find /tmp/xwin -type f -name xwin -perm -u+x | head -1)
          else
            cargo install xwin --locked
            XWIN=$(command -v xwin)
          fi
          "$XWIN" --version
          "$XWIN" --accept-license splat --output "$XWIN_ROOT"
          du -sh "$XWIN_ROOT"

      - name: Restore third-party package cache
        uses: actions/cache@v4
        with:
          path: ${{ env.SL_3P_CACHE }}
          key: 3p-win-${{ hashFiles('indra/cmake/3p_manifest.json') }}
          restore-keys: 3p-win-

      - name: Cross-build and package Prestige (Windows x64)
        run: |
          set -euo pipefail
          bash scripts/ci/version.sh
          make windows RUN_CHECKS=0 SL_3P_CACHE="$SL_3P_CACHE"
          ls -la build-windows-x86_64/package/
          df -h /

      - name: Upload Prestige for Windows
        uses: actions/upload-artifact@v4
        with:
          name: Prestige-Windows-x64
          path: |
            build-windows-x86_64/package/*_win64.zip
            build-windows-x86_64/package/*_Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-windows-x86_64/CMakeFiles/CMakeOutput.log
            build-windows-x86_64/CMakeFiles/CMakeError.log
            build-windows-x86_64/CMakeFiles/CMakeConfigureLog.yaml
            build-windows-x86_64/.ninja_log
          if-no-files-found: ignore
